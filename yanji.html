<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Private Note">
  <meta name="theme-color" content="#FFFFFF">
  <title>Private Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      background-color: #F2F2F7;
      color: #1C1C1E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .lock-card {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 32px 24px 28px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .app-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px auto;
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }
    .app-icon svg {
      width: 32px;
      height: 32px;
      color: #FFFFFF;
    }
    .app-title {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .app-desc {
      font-size: 13px;
      color: #64748B;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .password-input {
      width: 100%;
      height: 48px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 16px;
      color: #0F172A;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
      letter-spacing: 2px;
    }
    .password-input:focus {
      background: #FFFFFF;
      border-color: #2563EB;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }
    .btn-unlock {
      width: 100%;
      height: 48px;
      background: #2563EB;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-unlock:hover {
      background: #1D4ED8;
    }
    .btn-unlock:active {
      transform: scale(0.98);
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #64748B;
      cursor: pointer;
    }
    .remember-row input {
      accent-color: #2563EB;
      cursor: pointer;
    }
    .error-msg {
      margin-top: 14px;
      font-size: 12px;
      color: #EF4444;
      font-weight: 500;
      min-height: 18px;
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="lock-card" id="lockBox">
    <div class="app-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="app-title">受保护的旅行手账</h1>
    <p class="app-desc">此内容已受强加密保护。<br>请输入密码解锁：</p>

    <div class="input-wrapper">
      <input type="password" id="pwdInput" class="password-input" placeholder="输入5位数字密码" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="current-password" autofocus>
    </div>

    <label class="remember-row">
      <input type="checkbox" id="rememberCheck" checked>
      <span>记住密码，下次自动解锁</span>
    </label>

    <button id="unlockBtn" class="btn-unlock" onclick="handleUnlock()">解锁</button>
    <div id="errorMsg" class="error-msg"></div>
  </div>

    function b64ToBuf(b64) {
      const bin = atob(b64);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        buf[i] = bin.charCodeAt(i);
      }
      return buf;
    }

    async function decryptWithPassword(pwd) {
      const enc = new TextEncoder();
      const pwdBytes = enc.encode(pwd);

      const baseKey = await window.crypto.subtle.importKey(
        'raw',
        pwdBytes,
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const saltBuf = b64ToBuf(CIPHER_DATA.salt);
      const ivBuf = b64ToBuf(CIPHER_DATA.iv);
      const tagBuf = b64ToBuf(CIPHER_DATA.tag);
      const dataBuf = b64ToBuf(CIPHER_DATA.data);

      const combinedCiphertext = new Uint8Array(dataBuf.length + tagBuf.length);
      combinedCiphertext.set(dataBuf, 0);
      combinedCiphertext.set(tagBuf, dataBuf.length);

      const aesKey = await window.crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: saltBuf,
          iterations: 100000,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decryptedBuf = await window.crypto.subtle.decrypt(
        {
          name: 'AES-GCM',
          iv: ivBuf
        },
        aesKey,
        combinedCiphertext
      );

      const dec = new TextDecoder('utf-8');
      return dec.decode(decryptedBuf);
    }

    async function handleUnlock(presetPwd) {
      const pwdInput = document.getElementById('pwdInput');
      const errorMsg = document.getElementById('errorMsg');
      const lockBox = document.getElementById('lockBox');
      const unlockBtn = document.getElementById('unlockBtn');
      const remember = document.getElementById('rememberCheck').checked;

      const pwd = presetPwd || pwdInput.value.trim();
      if (!pwd) {
        errorMsg.innerText = '请输入密码';
        return;
      }

      unlockBtn.disabled = true;
      unlockBtn.innerText = '正在安全解密...';
      errorMsg.innerText = '';

      try {
        const decryptedHtml = await decryptWithPassword(pwd);
        
        if (remember) {
          try {
            localStorage.setItem('yj_cw_token', pwd);
          } catch(e) {}
        }

        document.open();
        document.write(decryptedHtml);
        document.close();
      } catch (err) {
        console.error('Decryption failed:', err);
        unlockBtn.disabled = false;
        unlockBtn.innerText = '解锁';
        errorMsg.innerText = '密码不正确，请重新输入';
        lockBox.classList.remove('shake');
        void lockBox.offsetWidth;
        lockBox.classList.add('shake');
        pwdInput.value = '';
        pwdInput.focus();
      }
    }

    document.getElementById('pwdInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        handleUnlock();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('yj_cw_token');
        if (saved) {
          handleUnlock(saved);
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
