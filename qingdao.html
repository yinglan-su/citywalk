<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Private Note">
  <meta name="theme-color" content="#FFFFFF">
  <title>Private Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      background-color: #F2F2F7;
      color: #1C1C1E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .lock-card {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 32px 24px 28px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .lock-icon-wrapper {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: #EBF5FF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px auto;
      font-size: 30px;
    }
    .app-title {
      font-size: 21px;
      font-weight: 700;
      color: #1C1C1E;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .app-desc {
      font-size: 13px;
      color: #8E8E93;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      color: #2563EB;
      margin-bottom: 20px;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 14px;
    }
    .password-input {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: #FAFAFC;
      padding: 0 16px;
      font-size: 16px;
      color: #1C1C1E;
      outline: none;
      transition: all 0.2s;
      text-align: center;
      letter-spacing: 2px;
    }
    .password-input:focus {
      border-color: #2563EB;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: #636366;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .remember-row input {
      width: 16px;
      height: 16px;
      accent-color: #2563EB;
    }
    .btn-unlock {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: #2563EB;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
      transition: all 0.15s;
    }
    .btn-unlock:active {
      transform: scale(0.98);
      background: #1D4ED8;
    }
    .error-msg {
      font-size: 12px;
      color: #FF3B30;
      margin-top: 12px;
      min-height: 18px;
      font-weight: 500;
    }
    .shake {
      animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
  </style>
</head>
<body>

  <div id="lockBox" class="lock-card">
    <div class="lock-icon-wrapper" style="background:#EFF6FF;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1 class="app-title">Private Note</h1>
    <div class="security-badge" style="color:#2563EB; background:#EFF6FF; border:1px solid #BFDBFE;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span>AES-256 GCM 强加密</span>
    </div>
    <p class="app-desc">此内容已受强加密保护。<br>请输入密码解锁：</p>

    <div class="input-wrapper">
      <input type="password" id="pwdInput" class="password-input" placeholder="输入5位数字密码" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="current-password" autofocus>
    </div>

    <label class="remember-row">
      <input type="checkbox" id="rememberCheck" checked>
      <span>记住密码，下次自动解锁</span>
    </label>

    <button id="unlockBtn" class="btn-unlock" onclick="handleUnlock()">解锁</button>
    <div id="errorMsg" class="error-msg"></div>
  </div>

    function b64ToBuf(b64) {
      const bin = atob(b64);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        buf[i] = bin.charCodeAt(i);
      }
      return buf;
    }

    async function decryptWithPassword(pwd) {
      const enc = new TextEncoder();
      const pwdBytes = enc.encode(pwd);

      const baseKey = await window.crypto.subtle.importKey(
        'raw',
        pwdBytes,
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const saltBuf = b64ToBuf(CIPHER_DATA.salt);
      const ivBuf = b64ToBuf(CIPHER_DATA.iv);
      const tagBuf = b64ToBuf(CIPHER_DATA.tag);
      const dataBuf = b64ToBuf(CIPHER_DATA.data);

      const combinedCiphertext = new Uint8Array(dataBuf.length + tagBuf.length);
      combinedCiphertext.set(dataBuf, 0);
      combinedCiphertext.set(tagBuf, dataBuf.length);

      const aesKey = await window.crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: saltBuf,
          iterations: 100000,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decryptedBuf = await window.crypto.subtle.decrypt(
        {
          name: 'AES-GCM',
          iv: ivBuf
        },
        aesKey,
        combinedCiphertext
      );

      const dec = new TextDecoder('utf-8');
      return dec.decode(decryptedBuf);
    }

    async function handleUnlock(presetPwd) {
      const pwdInput = document.getElementById('pwdInput');
      const errorMsg = document.getElementById('errorMsg');
      const lockBox = document.getElementById('lockBox');
      const unlockBtn = document.getElementById('unlockBtn');
      const remember = document.getElementById('rememberCheck').checked;

      const pwd = presetPwd || pwdInput.value.trim();
      if (!pwd) {
        errorMsg.innerText = '请输入密码';
        return;
      }

      unlockBtn.disabled = true;
      unlockBtn.innerText = '正在安全解密...';
      errorMsg.innerText = '';

      try {
        const decryptedHtml = await decryptWithPassword(pwd);
        
        if (remember) {
          try {
            localStorage.setItem('qd_cw_token', pwd);
          } catch(e) {}
        }

        document.open();
        document.write(decryptedHtml);
        document.close();
      } catch (err) {
        console.error('Decryption failed:', err);
        unlockBtn.disabled = false;
        unlockBtn.innerText = '解锁';
        errorMsg.innerText = '密码不正确，请重新输入';
        lockBox.classList.remove('shake');
        void lockBox.offsetWidth;
        lockBox.classList.add('shake');
        pwdInput.value = '';
        pwdInput.focus();
      }
    }

    document.getElementById('pwdInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        handleUnlock();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('qd_cw_token');
        if (saved) {
          handleUnlock(saved);
        }
      } catch(e) {}
    });
  </script>
